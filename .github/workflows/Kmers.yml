# Kmers.jl has tight compat bounds on BioSequences, because it depends on
# BioSequences internals. This workflow checks that the current version of
# BioSequences is installable with, and passes the tests of, Kmers.jl.
# Unlike the Downstream workflow, failure to resolve is an error here: It means
# Kmers.jl needs a new release with updated compat bounds when this version of
# BioSequences is released.
name: Kmers compat
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Kmers.jl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Clone Kmers.jl
        uses: actions/checkout@v4
        with:
          repository: BioJulia/Kmers.jl
          path: downstream
      - name: Load this and run the Kmers.jl tests
        shell: julia --color=yes --project=downstream {0}
        run: |
          ENV["JULIA_PKG_PRECOMPILE_AUTO"] = 0
          using Pkg
          try
            # force it to use this PR's version of the package
            Pkg.develop(PackageSpec(path="."))
            Pkg.update()
          catch err
            err isa Pkg.Resolve.ResolverError || rethrow()
            println("::error title=Kmers.jl incompatible::Kmers.jl cannot be resolved ",
              "with this version of BioSequences. Update its [compat] bounds and release ",
              "a new version of Kmers.jl alongside this version of BioSequences.")
            rethrow()
          end
          Pkg.test()
